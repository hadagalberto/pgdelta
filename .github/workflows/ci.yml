name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors everywhere, matching the local commands documented
  # in both READMEs and run in docs/SPEC-CHECKLIST.md.
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: ${{ matrix.os }} — fmt, clippy, build, test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: tests
        # No database on this matrix: live tests are covered by the
        # integration-postgres jobs, so the CI-unset guard is opted out here.
        env:
          PGDELTA_SKIP_LIVE_TESTS: '1'
        run: cargo test --workspace

  integration-postgres:
    name: postgres ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['13', '14', '15', '16', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGDELTA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Snapshot, property, parity and live convergence tests
        # Introspection is in-process (tokio-postgres): no pg_dump binary is
        # needed. Serial execution keeps throwaway-database creation bounded.
        run: cargo test --workspace -- --nocapture --test-threads=1
